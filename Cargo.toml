[package]
name = "gray-orchestrate"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Merged orchestration plugin for the gray agent harness: loop, gsd, workflows, plan, plannotator in one sidecar."

[[bin]]
name = "orchestrate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
yaml-rust2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
strip = true
